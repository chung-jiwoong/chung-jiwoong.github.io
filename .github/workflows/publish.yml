name: Render and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.29

      # ubuntu-latest ships no CJK font, and Libertinus Serif (the Typst
      # default) has no Hangul. Without this the Korean journal names in
      # the CV render as tofu boxes in cv.pdf.
      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Render site
        run: quarto render

      # GitHub Pages runs Jekyll by default; this tells it to serve the
      # rendered files as-is.
      - name: Ensure .nojekyll
        run: touch docs/.nojekyll

      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ is already up to date."
          else
            git commit -m "Render site [skip ci]"
            git push
          fi
